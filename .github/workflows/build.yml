name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Crear proyecto
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 jszip
          mkdir www
          cp lector-epub.html www/index.html
          cp node_modules/jszip/dist/jszip.min.js www/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js#jszip.min.js#' www/index.html
          npx cap init Lector com.ejemplo.lector --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Pantalla completa
        run: |
          cat > android/app/src/main/java/com/ejemplo/lector/MainActivity.java <<'EOF'
          package com.ejemplo.lector;
          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) { super.onCreate(b); hideBars(); }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
            private void hideBars() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          EOF
          sed -i 's#\(<style name="AppTheme.NoActionBar"[^>]*>\)#\1\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' android/app/src/main/res/values/styles.xml
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lector-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
